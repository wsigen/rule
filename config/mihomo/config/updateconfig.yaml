# Sub-Store Mihomo 覆写模板
# 仅包含通用参数、策略组、分流规则和规则集；不包含机场节点/订阅凭据。
# 请在 Sub-Store「文件 -> Mihomo 配置」中选择订阅来源并应用此覆写模板。

# ==================== 基础配置 ====================
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

# 默认仅允许本机访问控制 API；如需从局域网其他设备管理，见下方说明。
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# ==================== 嗅探 ====================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== TUN 透明代理 ====================
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==================== DNS ====================
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  # 注意：blacklist 模式下不要放 "*"，否则所有域名都会被排除在 Fake-IP 之外。
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"

  # 用于解析 DoH 域名及代理节点服务器域名，避免节点域名解析依赖代理本身。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"

